name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-vercel.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-vercel.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel Environment Information
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            bunx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            bunx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi

      - name: Build Project Artifacts
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            bunx vercel@latest build --prod --token="$VERCEL_TOKEN"
          else
            bunx vercel@latest build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy Project Artifacts to Vercel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            bunx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            bunx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
